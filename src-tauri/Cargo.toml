[package]
name = "form-studio"
version = "0.1.0"
description = "FORM — Abstract Motion Studio. Generative 3D looping background video tool."
authors = ["Raoul"]
edition = "2021"

# See more keys at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` suffix avoids clashing with the binary target name on Windows.
name = "form_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller, faster binary for distribution — standard Tauri release tuning.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
